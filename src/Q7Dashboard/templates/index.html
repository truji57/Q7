<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 Dashboard</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #1a1d27;
            --border: #2a2d3a;
            --accent: #4f8cff;
            --green: #00d4aa;
            --red: #ff4757;
            --yellow: #ffa502;
            --text: #e2e4eb;
            --text-muted: #7a7d8c;
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 4px;
        }
        .controls {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all .15s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.start { background: #0d3020; border-color: var(--green); color: var(--green); }
        .btn.stop { background: #301010; border-color: var(--red); color: var(--red); }
        .btn.warn { background: #302810; border-color: var(--yellow); color: var(--yellow); }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .status-dot.offline { background: var(--red); }

        .main {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .account-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: border-color .2s;
        }
        .account-card.active { border-color: var(--accent); }
        .account-card.target { border-color: var(--green); }
        .account-card.loss { border-color: var(--red); }
        .account-card.blown { border-color: var(--red); opacity: 0.6; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .card-id {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-trading { background: #1a3a2a; color: var(--green); }
        .badge-target { background: #1a3020; color: var(--green); }
        .badge-pending { background: #2a2a30; color: var(--text-muted); }
        .badge-loss { background: #3a1a1a; color: var(--red); }
        .badge-blown { background: #3a1010; color: var(--red); }
        .badge-waiting { background: #2a2a10; color: var(--yellow); }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text);
        }

        .pnl-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .pnl-label { color: var(--text-muted); }
        .pnl-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        .pnl-positive { color: var(--green); }
        .pnl-negative { color: var(--red); }

        .progress-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .3s;
        }
        .progress-fill.green { background: var(--green); }
        .progress-fill.red { background: var(--red); }

        .card-meta {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .log-panel {
            margin: 0 24px 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0;
            max-height: 200px;
            overflow: hidden;
        }
        .log-header {
            padding: 10px 16px;
            font-size: 11px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .log-list {
            list-style: none;
            padding: 8px 16px;
            max-height: 160px;
            overflow-y: auto;
        }
        .log-list li {
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #1a1a22;
            font-family: 'SF Mono', 'Consolas', monospace;
            color: var(--text-muted);
        }
        .log-list li:last-child { border: none; }
        .log-time { color: #555; margin-right: 8px; }

        .conn-status {
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Q7</h1>
    <span class="conn-status" id="connStatus">
        <span class="status-dot offline"></span>Offline
    </span>
    <div class="controls">
        <button class="btn start" onclick="sendCommand('START')">START</button>
        <button class="btn stop" onclick="sendCommand('STOP')">STOP</button>
        <button class="btn warn" onclick="sendCommand('PAUSE')">PAUSE</button>
        <button class="btn" onclick="sendCommand('SKIP')">SKIP ACCOUNT</button>
        <button class="btn" onclick="sendCommand('ROTATE')">ROTATE</button>
    </div>
</div>

<div class="main" id="accountsGrid"></div>

<div class="log-panel">
    <div class="log-header">Activity Log</div>
    <ul class="log-list" id="logList">
        <li><span class="log-time">--:--</span> Waiting for events...</li>
    </ul>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
const MAX_LOG = 50;
let logs = [];

function addLog(msg) {
    const now = new Date();
    const time = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    logs.unshift({ time, msg });
    if (logs.length > MAX_LOG) logs.pop();
    renderLogs();
}

function renderLogs() {
    const list = document.getElementById('logList');
    list.innerHTML = logs.map(l =>
        `<li><span class="log-time">${l.time}</span> ${l.msg}</li>`
    ).join('');
}

function statusBadge(status) {
    const map = {
        'TRADING': 'badge-trading',
        'TARGET_REACHED': 'badge-target',
        'PENDING': 'badge-pending',
        'LOSS_LIMIT': 'badge-loss',
        'CONSECUTIVE_LIMIT': 'badge-loss',
        'BLOWN': 'badge-blown',
        'WAITING_RESET': 'badge-waiting'
    };
    const labels = {
        'TRADING': 'ACTIVE',
        'TARGET_REACHED': 'TARGET',
        'PENDING': 'PENDING',
        'LOSS_LIMIT': 'LOSS',
        'CONSECUTIVE_LIMIT': 'MAX LOSS',
        'BLOWN': 'BLOWN',
        'WAITING_RESET': 'WAITING'
    };
    return `<span class="card-badge ${map[status] || 'badge-pending'}">${labels[status] || status}</span>`;
}

function pnlClass(val) {
    if (val > 0) return 'pnl-positive';
    if (val < 0) return 'pnl-negative';
    return '';
}

function renderAccounts(accounts, activeIndex) {
    const grid = document.getElementById('accountsGrid');
    grid.innerHTML = accounts.map((a, i) => {
        const cardClass = i === activeIndex ? 'active' : a.status.includes('TARGET') ? 'target' : a.status.includes('LOSS') || a.status.includes('BLOWN') ? 'loss' : '';
        const progressPct = a.daily_target > 0 ? Math.min(100, Math.abs(a.daily_pnl / a.daily_target * 100)) : 0;
        const progressClass = a.daily_pnl >= 0 ? 'green' : 'red';

        return `
        <div class="account-card ${cardClass}">
            <div class="card-header">
                <span class="card-id">ACCOUNT #${a.id}</span>
                ${statusBadge(a.status)}
            </div>
            <div class="card-name">${a.name}</div>

            <div class="pnl-row">
                <span class="pnl-label">Daily P&L</span>
                <span class="pnl-value ${pnlClass(a.daily_pnl)}">$${a.daily_pnl.toFixed(0)}</span>
            </div>
            <div class="pnl-row">
                <span class="pnl-label">Target</span>
                <span class="pnl-value">$${a.daily_target.toFixed(0)}</span>
            </div>
            <div class="pnl-row">
                <span class="pnl-label">Total P&L</span>
                <span class="pnl-value ${pnlClass(a.total_pnl)}">$${a.total_pnl.toFixed(0)}</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill ${progressClass}" style="width:${progressPct}%"></div>
            </div>

            <div class="card-meta">
                <span>Trades: ${a.trades_today}</span>
                <span>Consec: ${a.consecutive_losses}</span>
                <span>Mart: ${a.martingale.toFixed(1)}x</span>
                <span>Ctr: ${a.contracts}</span>
            </div>
        </div>
        `;
    }).join('');
}

socket.on('connected', () => {
    document.getElementById('connStatus').innerHTML = '<span class="status-dot online"></span>Online';
    addLog('Connected to orchestrator');
});

socket.on('state_update', (state) => {
    document.getElementById('connStatus').innerHTML = '<span class="status-dot online"></span>Online';
    renderAccounts(state.accounts, state.active_account_index);

    const active = state.accounts[state.active_account_index];
    if (active) {
        document.title = `Q7 | ${active.name} $${active.daily_pnl.toFixed(0)}`;
    }
});

socket.on('disconnect', () => {
    document.getElementById('connStatus').innerHTML = '<span class="status-dot offline"></span>Offline';
    addLog('Connection lost');
});

async function sendCommand(cmd) {
    try {
        const res = await fetch('/api/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        addLog(`Command: ${cmd} → ${data.status || JSON.stringify(data)}`);
    } catch (e) {
        addLog(`Error: ${cmd} failed - ${e.message}`);
    }
}

addLog('Dashboard loaded');
</script>
</body>
</html>
